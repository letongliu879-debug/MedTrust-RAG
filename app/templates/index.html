<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedTrust-RAG — 医疗问答</title>
  <style>
    * { box-sizing: border-box; }
    body {
      max-width: 860px;
      margin: 0 auto;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #222;
    }
    h1 { font-size: 24px; margin-bottom: 8px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 30px; }

    .query-box {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }
    textarea {
      width: 100%;
      height: 80px;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      font-size: 15px;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #4a90d9; }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 12px;
    }
    select {
      padding: 6px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    button {
      padding: 8px 28px;
      background: #4a90d9;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover { background: #3a7fc8; }
    button:disabled { background: #aaa; cursor: not-allowed; }

    .status {
      margin: 12px 0;
      font-size: 14px;
      color: #666;
    }
    .status .risk-safe { color: #27ae60; font-weight: bold; }
    .status .risk-caution { color: #e67e22; font-weight: bold; }
    .status .risk-danger { color: #c0392b; font-weight: bold; }

    .result-box {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-top: 16px;
    }
    .result-text {
      line-height: 1.7;
      font-size: 15px;
      white-space: pre-wrap;
    }
    .citations {
      margin-top: 16px;
      border-top: 1px solid #eee;
      padding-top: 12px;
    }
    .citation {
      background: #f8f8f8;
      padding: 8px 12px;
      margin: 6px 0;
      border-radius: 4px;
      font-size: 13px;
      color: #555;
    }
    .citation span { color: #888; font-size: 12px; }

    .example-queries {
      margin-top: 30px;
    }
    .example-queries h3 { font-size: 14px; color: #888; margin-bottom: 10px; }
    .examples { display: flex; flex-wrap: wrap; gap: 8px; }
    .examples button {
      padding: 5px 14px;
      background: #f0f0f0;
      color: #333;
      font-size: 13px;
      border: 1px solid #ddd;
    }
    .examples button:hover { background: #e0e0e0; }

    .footer {
      margin-top: 40px;
      font-size: 12px;
      color: #bbb;
      text-align: center;
    }
  </style>
</head>
<body>

<h1>🏥 MedTrust-RAG</h1>
<p class="subtitle">基于 Huatuo26M-Lite · 混合检索 · 多 Agent 校验</p>

<div class="query-box">
  <textarea id="queryInput" placeholder="输入健康问题，如：高血压患者饮食注意什么？"></textarea>
  <div class="controls">
    <select id="deptSelect">
      <option value="">全部科室</option>
    </select>
    <button onclick="ask()" id="askBtn">查询</button>
  </div>
</div>

<div class="status" id="statusBar"></div>
<div id="resultArea"></div>

<div class="example-queries">
  <h3>示例问题</h3>
  <div class="examples">
    <button onclick="setQuery(this)">高血压患者饮食注意什么？</button>
    <button onclick="setQuery(this)">婴儿发烧38度怎么处理？</button>
    <button onclick="setQuery(this)">糖尿病可以根治吗？</button>
    <button onclick="setQuery(this)">颈椎病怎么缓解？</button>
    <button onclick="setQuery(this)">怀孕初期腹痛正常吗？</button>
  </div>
</div>

<div class="footer">
  本回答由 AI 生成，仅供参考，不构成医疗诊断或治疗建议
</div>

<script>
  // 加载初始化数据
  async function init() {
    const [healthRes, deptsRes] = await Promise.all([
      fetch('/health'),
      fetch('/departments')
    ]);
    const health = await healthRes.json();
    const depts = await deptsRes.json();

    // 科室
    const deptSel = document.getElementById('deptSelect');
    depts.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.name;
      opt.textContent = d.name;
      deptSel.appendChild(opt);
    });

    // BM25 状态
    if (!health.bm25_ready) {
      document.getElementById('statusBar').textContent = '⚠️ BM25 索引构建中，首次查询可能较慢...';
    }
  }

  function setQuery(btn) {
    document.getElementById('queryInput').value = btn.textContent;
  }

  async function ask() {
    const q = document.getElementById('queryInput').value.trim();
    if (!q) return;

    const btn = document.getElementById('askBtn');
    const status = document.getElementById('statusBar');
    const result = document.getElementById('resultArea');

    btn.disabled = true;
    status.innerHTML = '处理中...';
    result.innerHTML = '';

    try {
      const res = await fetch('/query', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          query: q,
          department: document.getElementById('deptSelect').value || null
        })
      });

      if (!res.ok) throw new Error('请求失败: ' + res.status);
      const data = await res.json();

      const risk = data.safety?.risk_level || 'safe';
      const riskClass = risk === 'safe' ? 'risk-safe' : risk === 'caution' ? 'risk-caution' : 'risk-danger';
      const riskLabel = risk === 'safe' ? '✅ 可信' : risk === 'caution' ? '⚠️ 需注意' : '🚨 有风险';

      status.innerHTML = `安全: <span class="${riskClass}">${riskLabel}</span> &nbsp;|&nbsp; 置信度: <b>${(data.confidence * 100).toFixed(0)}%</b> &nbsp;|&nbsp; 模型: ${data.model_used}`;

      let html = '<div class="result-box">';
      html += `<div class="result-text">${escapeHtml(data.answer)}</div>`;

      if (data.citations && data.citations.length > 0) {
        html += '<div class="citations"><b>引用来源</b>';
        data.citations.slice(0, 5).forEach((c, i) => {
          html += `<div class="citation"><span>[${i+1}]</span> ${escapeHtml(c.text || '')}</div>`;
        });
        html += '</div>';
      }
      html += '</div>';
      result.innerHTML = html;

    } catch (err) {
      status.innerHTML = '<span style="color:#c0392b">错误: ' + err.message + '</span>';
    } finally {
      btn.disabled = false;
    }
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  init();
</script>

</body>
</html>

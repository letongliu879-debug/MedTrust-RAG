# MedTrust-RAG 评测配置

evaluation:
  # 测试集大小（从 Huatuo-Lite 中抽样）
  test_split_size: 500

  # 裁判模型（建议用不同于生成模型的其他模型，避免同模型偏好）
  judge_model: "zhipu"

  # 检索评测
  retrieval:
    k_values: [1, 3, 5, 10]

  # 答案质量评测
  answer_quality:
    bert_model: "bert-base-chinese"
    # BERTScore 需要 GPU 才能批量跑，CPU 会很慢
    # 设为 false 则跳过 BERTScore，只算 BLEU + ROUGE
    use_bert_score: false

  # LLM 裁判评测
  llm_judge:
    enabled: true
    sample_size: 50  # LLM 调用贵，只抽 50 条
    dimensions:
      - faithfulness
      - safety
      - relevance
      - completeness
